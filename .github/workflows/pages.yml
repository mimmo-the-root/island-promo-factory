name: pages
on:
  push:
    branches: [main]
    paths: ["docs/**", "scripts/build_manual.py", "CHANGELOG.md", "VERSION", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build the manual (also lints links, anchors, external resources)
        run: python scripts/build_manual.py && python scripts/build_manual.py --check
      - name: Assemble the site (manual at the root, demo results under /demo/)
        run: |
          mkdir -p _site
          cp -r docs/manual-html/. _site/
          if [ -d docs/demo ]; then mkdir -p _site/demo && cp -r docs/demo/. _site/demo/; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
